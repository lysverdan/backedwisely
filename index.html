<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Backed Wisely — Consumer Intelligence Platform</title>
  <meta name="description" content="Backed Wisely — independent consumer intelligence platform. Good Car Bad Car and the verticals to follow." />
  <link rel="icon" type="image/png" href="logo.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter+Tight:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #0a0a0a;
      --bg-deep: #050505;
      --gold: #d4a44a;
      --gold-bright: #f0c060;
      --silver: #c8c8cc;
      --text-mute: #8a8a90;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--silver);
      font-family: 'Inter Tight', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Vignette + subtle grain backdrop */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at center, rgba(212, 164, 74, 0.06) 0%, transparent 55%),
        radial-gradient(ellipse at center, #111 0%, #050505 80%);
      z-index: -2;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.4'/></svg>");
      opacity: 0.05;
      pointer-events: none;
      z-index: -1;
    }

    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    .logo-wrap {
      max-width: 460px;
      width: 85%;
      opacity: 0;
      transform: translateY(12px);
      animation: rise 1.2s cubic-bezier(0.2, 0.7, 0.2, 1) 0.1s forwards;
    }
    .logo-wrap img {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 20px 40px rgba(0,0,0,0.6));
    }

    .tagline {
      margin-top: 2.5rem;
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(1.25rem, 2.6vw, 1.75rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--silver);
      opacity: 0;
      transform: translateY(12px);
      animation: rise 1.2s cubic-bezier(0.2, 0.7, 0.2, 1) 0.7s forwards;
    }
    .tagline .accent {
      color: var(--gold);
      font-style: italic;
      text-transform: none;
      letter-spacing: 0.04em;
      font-weight: 400;
    }

    .divider {
      margin: 2rem auto 0;
      width: 1px;
      height: 48px;
      background: linear-gradient(to bottom, transparent, var(--gold), transparent);
      opacity: 0;
      animation: fade 1.2s ease 1.2s forwards;
    }

    .sub {
      margin-top: 1.5rem;
      font-size: 0.78rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-mute);
      opacity: 0;
      animation: fade 1.2s ease 1.5s forwards;
    }

    footer {
      position: fixed;
      bottom: 1.25rem;
      left: 0; right: 0;
      text-align: center;
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #4a4a4f;
      opacity: 0;
      animation: fade 1.2s ease 1.8s forwards;
    }

    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fade {
      to { opacity: 1; }
    }

    @media (max-width: 480px) {
      .tagline { letter-spacing: 0.14em; margin-top: 1.75rem; }
      .sub { letter-spacing: 0.22em; }
    }
  </style>
</head>
<body>
  <main>
    <div class="logo-wrap">
      <img src="logo.png" alt="Backed Wisely" />
    </div>

    <p class="tagline">
      Independent <span class="accent">Consumer Intelligence</span> Platform
    </p>

    <div class="divider"></div>

    <p class="sub">Something new is coming</p>
  </main>

  <footer>© Backed Wisely Inc.</footer>
</body>
</html>
